<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Decodex | Select Language</title>

    <link
        rel="stylesheet"
        href="css/language.css"
    >

</head>


<body>

    <main class="language-page">

        <div class="background-glow glow-one"></div>
        <div class="background-glow glow-two"></div>


        <!-- NAVBAR -->

        <nav class="navbar">

            <div class="brand">

                <div class="brand-symbol">
                    ◇
                </div>

                <span>Decodex</span>

            </div>


            <div class="nav-right">

            </div>

        </nav>


        <!-- CONTENT -->

        <section class="language-content">


            <div class="heading-section">

                <div class="small-label">
                    STEP 01
                </div>

                <h1>
                    Choose your
                    <span>coding language.</span>
                </h1>

                <p>
                    Select the language you want to use
                    in the Decodex coding workspace.
                </p>

            </div>


            <!-- LANGUAGE CARDS -->

            <div class="language-grid">


                <button
                    class="language-card"
                    data-language="Java"
                >

                    <div class="card-top">

                        <div class="language-icon java">
                            ☕
                        </div>

                        <span class="card-arrow">
                            →
                        </span>

                    </div>

                    <div class="card-content">

                        <h2>Java</h2>

                        <p>
                            Object-oriented programming
                            with Java.
                        </p>

                    </div>

                </button>


                <button
                    class="language-card"
                    data-language="Python"
                >

                    <div class="card-top">

                        <div class="language-icon python">
                            🐍
                        </div>

                        <span class="card-arrow">
                            →
                        </span>

                    </div>

                    <div class="card-content">

                        <h2>Python</h2>

                        <p>
                            Simple and powerful
                            programming with Python.
                        </p>

                    </div>

                </button>


                <button
                    class="language-card"
                    data-language="C"
                >

                    <div class="card-top">

                        <div class="language-icon c">
                            C
                        </div>

                        <span class="card-arrow">
                            →
                        </span>

                    </div>

                    <div class="card-content">

                        <h2>C</h2>

                        <p>
                            Learn programming
                            fundamentals with C.
                        </p>

                    </div>

                </button>


                <button
                    class="language-card"
                    data-language="C++"
                >

                    <div class="card-top">

                        <div class="language-icon cpp">
                            C++
                        </div>

                        <span class="card-arrow">
                            →
                        </span>

                    </div>

                    <div class="card-content">

                        <h2>C++</h2>

                        <p>
                            Efficient programming
                            with C++.
                        </p>

                    </div>

                </button>


                <button
                    class="language-card"
                    data-language="JavaScript"
                >

                    <div class="card-top">

                        <div class="language-icon javascript">
                            JS
                        </div>

                        <span class="card-arrow">
                            →
                        </span>

                    </div>

                    <div class="card-content">

                        <h2>JavaScript</h2>

                        <p>
                            Build interactive
                            web applications.
                        </p>

                    </div>

                </button>


            </div>


            <!-- SELECTED LANGUAGE -->

            <div class="selection-area">

                <p id="selectionMessage">
                    Select a language to continue.
                </p>

                <button
                    id="continueButton"
                    class="continue-button"
                    disabled
                >
                    Continue
                    <span>→</span>
                </button>

            </div>


        </section>


        <footer>

            <span>
                Decodex
            </span>

            <span>
                AI-powered code understanding
            </span>

        </footer>

    </main>


    <script src="js/language.js"></script>

</body>

</html>
